name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 2.6.1

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Tests (rules engine, audio, desktop render)
        run: ./gradlew :shared:desktopTest
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.REFINERS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/refinersfire-release.jks"
            echo "REFINERS_KEYSTORE_FILE=$RUNNER_TEMP/refinersfire-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          REFINERS_KEYSTORE_PASSWORD: ${{ secrets.REFINERS_KEYSTORE_PASSWORD }}
          REFINERS_BUILD_NUMBER: ${{ github.run_number }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: ./gradlew :app:assembleRelease
      - name: Verify signature
        if: env.REFINERS_KEYSTORE_FILE != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          grep -qi "fc:c1:bb:f0:b4:c9:70:85\|fcc1bbf0b4c97085" certs.txt
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "RefinersFire-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: RefinersFire-*-android.apk

  windows:
    name: Build Windows MSI & Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew
      - name: Build MSI and app image
        shell: bash
        env:
          REFINERS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :desktop:packageMsi :desktop:createDistributable
      - name: Collect
        shell: pwsh
        run: |
          Copy-Item (Get-ChildItem desktop/build/compose/binaries/main/msi/*.msi | Select-Object -First 1).FullName "RefinersFire-$env:VERSION-windows-setup.msi"
          Compress-Archive -Path "desktop/build/compose/binaries/main/app/Refiners Fire" -DestinationPath "RefinersFire-$env:VERSION-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            RefinersFire-*-windows-setup.msi
            RefinersFire-*-windows-portable.zip

  web:
    name: Build web version (iPhone, iPad, browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew :shared:wasmJsBrowserDistribution
      - name: Stamp version
        run: |
          cd shared/build/dist/wasmJs/productionExecutable
          sed -i "s|name=\"rf-version\" content=\"dev\"|name=\"rf-version\" content=\"${VERSION}\"|" index.html
          sed -i "s|name=\"rf-build\" content=\"0\"|name=\"rf-build\" content=\"${{ github.run_number }}\"|" index.html
          sed -i "s|'refinersfire-v1'|'refinersfire-${VERSION}-${{ github.run_number }}'|" sw.js
          grep -q "content=\"${VERSION}\"" index.html
          grep -q "refinersfire-${VERSION}-" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shared/build/dist/wasmJs/productionExecutable

  web-deploy:
    name: Publish web version
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    needs: [android, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Refiner's Fire ${{ env.VERSION }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android** (phones & foldables): download `RefinersFire-${{ env.VERSION }}-android.apk` on your phone and open it
            (allow "install unknown apps" for your browser or file manager when asked).

            **Windows 10/11**:
            - `RefinersFire-${{ env.VERSION }}-windows-setup.msi`: installer with Start-menu and desktop shortcuts.
            - `RefinersFire-${{ env.VERSION }}-windows-portable.zip`: no install; unzip anywhere and run `Refiners Fire\Refiners Fire.exe`.

            **iPhone & iPad**: open https://geoguy89.github.io/refiners-fire/ in Safari, tap Share, then *Add to Home Screen*
            (iOS 18.2 or newer). It updates by itself.

            The builds are not code-signed, so Windows SmartScreen may warn: choose *More info → Run anyway*.
          files: dist/*
